name: Mirror to killnopig.github.io/dose-tracker-sync

# The old APK 2.0.0 (com.killnopig.dosetracker.sync) and its on-device data
# live on the origin https://killnopig.github.io. This copies the site into the
# dose-tracker-sync/ folder of the killnopig/killnopig.github.io user-site repo.
#
# Secret KILLNOPIG_PAGES_TOKEN: fine-grained token of the killnopig account,
# repository access limited to killnopig/killnopig.github.io, Contents: read and write.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dose-tracker-sync
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout killnopig.github.io
        uses: actions/checkout@v4
        with:
          repository: killnopig/killnopig.github.io
          token: ${{ secrets.KILLNOPIG_PAGES_TOKEN }}
          path: site

      - name: Copy site into dose-tracker-sync/
        run: |
          mkdir -p site/dose-tracker-sync
          rsync -a --delete --exclude '.git' --exclude '.github' src/ site/dose-tracker-sync/

      - name: Commit and push
        working-directory: site
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dose-tracker-sync
          if git diff --cached --quiet; then
            echo "No changes to mirror."
            exit 0
          fi
          git commit -m "Mirror dose-tracker-sync ${SRC_SHA::7}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          exit 1
